; ESP32-C3 指纹锁固件
; 使用 PlatformIO 构建：安装 VSCode + PlatformIO 插件后直接打开本目录
[env:esp32-c3-devkitm-1]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; BLE + WiFi + MQTT 体积较大，使用 huge_app 分区（约 3MB 应用区）
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; ESP32-C3 板载 USB-Serial-JTAG：日志走 USB COM 口（COM65）
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 依赖库已内置到 lib/ 目录（离线编译，无需联网安装）：
;   lib/Adafruit_Fingerprint  —— Adafruit Fingerprint Sensor Library
;   lib/PubSubClient          —— MQTT 客户端
;   lib/ArduinoJson           —— JSON (v6.21.5)
; BLE 使用 Arduino-ESP32 自带 ESP32 BLE Arduino
