; ESP32-C3 指纹锁固件
; 使用 PlatformIO 构建：安装 VSCode + PlatformIO 插件后直接打开本目录
[env:esp32-c3-devkitm-1]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; BLE + WiFi + MQTT 体积较大，使用 huge_app 分区（约 3MB 应用区）
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1

; 注：不使用 ARDUINO_USB_CDC_ON_BOOT=1（该内核 2.0.17 启用后 FrameworkArduino
; 自身会因 serialEventRun() 引用未定义的 Serial 而编译失败）。
; 日志走 UART0（GPIO20 RX / GPIO21 TX，115200），USB 仅用于烧录。

; 依赖库已内置到 lib/ 目录（离线编译，无需联网安装）：
;   lib/Adafruit_Fingerprint  —— Adafruit Fingerprint Sensor Library
;   lib/PubSubClient          —— MQTT 客户端
;   lib/ArduinoJson           —— JSON (v6.21.5)
; BLE 使用 Arduino-ESP32 自带 ESP32 BLE Arduino
